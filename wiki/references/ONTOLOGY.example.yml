# 작성 예시. 원본 자료와 조회용 사본을 함께 쓰는 가상의 구성이다.
# 소스 종류·개수·이름·태그는 프로젝트에 맞게 바꾼다.
# 실제 사용 시 <...>를 채우고 필요한 선택 속성만 남긴다.
# 키 끝의 ?는 선택 속성 표기다. 필요 없으면 하위 항목까지 생략한다.
# 실제 문서를 작성할 때는 사용하는 속성의 ?를 제거한다.
# 이름은 각 목록 안에서 고유한 영문 snake_case 식별자이고, 한글명은 필수 표시명이다.
# 관계의 주체·대상은 개념의 이름을 참조한다.
# 최상위 소스는 DB·문서·파일 등 실제 데이터 소스 단위로 정의한다.
# 개념 내부 소스의 이름은 최상위 소스의 이름을 참조한다.
# 소스정보에는 개념별 위치·필드·범위를, 최상위 소스의 사용방법에는 공통 접근 절차를 적는다.
# 태그 예: 정본, 우선 탐색 대상, 참고본. 한 소스에 여러 태그를 붙일 수 있다.
# 같은 정보 범위의 정본은 하나로 정한다. 정본이 여러 곳이면 범위?를 작성해 구분한다.
# 우선 탐색 대상은 조회 순서를 뜻한다. 정보가 충돌하면 정본을 따른다.
# 동기화?는 소스 사이의 동기화가 필요할 때 작성한다.
# 동기화 항목의 원본·대상은 같은 개념 내부의 소스 이름을 참조하며, 방법과 함께 필수다.
# 관계는 방향이 분명한 동사로 쓴다. 대상이 여럿이면 관계를 나눠 적는다.

개념:
  - 이름: concept_a
    한글명: "<개념 A의 한글 이름>"
    의미: "<무엇을 뜻하며 어디까지 포함하는지>"
    소스:
      - 이름: primary_record
        한글명: 원본 항목
        태그: [정본]
        소스정보:
          범위?: "<이 소스가 정본인 정보 범위>"
          위치: "<DB ID, 문서 ID, 파일 경로 또는 URL>"
          # 필요하면 식별필드, 본문섹션 등 구체적인 위치 정보를 추가한다.

      - 이름: local_copy
        한글명: 조회용 사본
        태그: [참고본, 우선 탐색 대상]
        소스정보:
          경로: "<프로젝트 기준 상대 경로>"
          조건?: "<조회 조건 또는 본문 섹션>"

    동기화?:
      - 원본: primary_record
        대상: local_copy
        방법: "정본 변경 후 <도구 또는 절차>로 필요한 범위를 대상에 반영하고 결과를 확인한다."

  - 이름: concept_b
    한글명: "<개념 B의 한글 이름>"
    의미: "<무엇을 뜻하며 개념 A와 어떻게 구별되는지>"
    소스:
      - 이름: primary_record
        한글명: 원본 항목
        태그: [정본, 우선 탐색 대상]
        소스정보:
          범위?: "<이 소스가 정본인 정보 범위>"
          위치: "<DB ID, 문서 ID, 파일 경로 또는 URL>"
    동기화?: []

관계:
  - 주체: concept_a
    관계: 참조한다
    대상: concept_b
    비고?:
      - "<실제로 연결하는 필드 또는 대조 방법>"
      - "<관계가 성립하는 조건이나 예외>"

소스:
  - 이름: primary_record
    한글명: 원본 항목
    사용방법:
      - "<이 원본 항목에 접근할 도구와 조회·변경 절차>"
      - "<변경 결과 확인 방법>"

  - 이름: local_copy
    한글명: 조회용 사본
    사용방법:
      - 상대 경로는 프로젝트 루트를 기준으로 해석한다.
      - "<파일을 읽는 도구와 방법>"
      - "<파일의 갱신 시각·무결성 등 최신성 확인 방법>"
