# 프로젝트별 온톨로지 작성을 위한 구조 템플릿이다.
# 개념·관계·소스의 종류와 개수는 프로젝트에 맞게 정의한다.
# 필요한 항목만 남기고, 같은 형식으로 복제해 늘린다.
# 각 항목을 작성할 때 ?가 없는 속성은 필수다.
# <...>는 프로젝트에 맞게 채우는 자리표시자다.
# 키 끝의 ?는 선택 속성 표기다. 필요 없으면 하위 항목까지 생략한다.
# 실제 문서를 작성할 때는 사용하는 속성의 ?를 제거한다.
# 이름은 각 목록 안에서 고유한 영문 snake_case 식별자이고, 한글명은 필수 표시명이다.
# 관계의 주체·대상은 개념의 이름을 참조한다.
# 최상위 소스는 DB·문서·파일 등 실제 데이터 소스 단위로 정의한다.
# 개념 내부 소스의 이름은 최상위 소스의 이름을 참조한다.
# 최상위 소스정보에는 실제 위치·식별자를, 개념 내부 소스정보에는 범위·필드·조건을 적는다.
# 로컬 파일의 경로, Notion DB의 주소·database_id·data_source_id는 해당 유형에서 필수다.
# 태그는 프로젝트별로 정한다. 예: 정본, 우선 탐색 대상, 참고본.
# 같은 정보 범위의 정본은 하나로 정한다. 정본이 여러 곳이면 범위?를 작성해 구분한다.
# 우선 탐색 대상은 조회 순서를 뜻한다. 정보가 충돌하면 정본을 따른다.
# 동기화?는 소스 간 동기화가 필요한 경우에만 작성한다.
# 동기화 항목의 원본·대상은 같은 개념 내부의 소스 이름을 참조하며, 방법과 함께 필수다.
# 관계는 방향이 분명한 동사로 쓴다. 대상이 여럿이면 관계를 나눠 적는다.

개념:
  - 이름: "<concept_id>"
    한글명: "<개념의 한글 이름>"
    의미: "<무엇을 뜻하며 어디까지 포함하는지>"
    소스:
      - 이름: "<source_id>"
        한글명: "<소스의 한글 이름>"
        태그: [] # 필요한 역할 태그를 붙인다.
        소스정보:
          범위?: "<이 소스가 담당하는 정보 범위>"
          조건?: "<조회 조건 또는 본문 섹션>"
          # 실제 위치는 최상위 소스 정의에 기록한다. 필요한 필드 정보를 더할 수 있다.

    동기화?:
      - 원본: "<from_source_id>"
        대상: "<to_source_id>"
        방법: "<언제, 어떤 도구나 절차로, 어느 범위를 반영하고 확인하는지>"

관계:
  - 주체: "<subject_concept_id>"
    관계: "<관계를 나타내는 동사>"
    대상: "<object_concept_id>"
    비고?:
      - "<실제 연결 필드, 대조 방법, 적용 조건 또는 예외>"

소스:
  - 이름: "<source_id>"
    한글명: "<소스의 한글 이름>"
    소스정보: {} # 필수. 실제 문서에서는 비워 두지 말고 유형별 실제 위치·식별자를 채운다.
    # 로컬 파일: 경로와 기준경로 또는 절대경로.
    # 파일 묶음: 디렉터리·경로 패턴·변수의 의미.
    # Notion DB: database_url, database_id, data_source_id.
    # Notion 페이지: 페이지 URL, page_id, 필요한 본문 섹션.
    # Drive 파일: 파일 URL과 file_id, 필요한 경우 접근 계정.
    # 메일: 계정과 메시지 URL 또는 메시지 ID.
    # 연결 자료: 실제 URL·파일 ID가 저장된 문서 경로·섹션·필드.
    사용방법:
      - "<접근 도구와 사용 절차>"
