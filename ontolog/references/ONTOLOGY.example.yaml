# 엔티티를 다루기 전에 작업에 필요한 명세만 먼저 읽는다.
# 명세문서 경로는 프로젝트 루트 기준이다. 경로가 없으면 docs/ontology/<이름>.md가 있는 경우 읽는다.
# 할 일의 완료 여부를 판단할 때는 docs/ontology/task.md에서 완료 기준을 확인한다.

# 작성 예시. 원본 자료와 조회용 사본을 함께 쓰는 가상의 구성이다.
# 아래 경로·URL·UUID는 설명용 가상 값이며 실제 존재하거나 검증된 자료가 아니다.
# 개념·소스·저장 방식·개수와 태그는 프로젝트에 맞게 바꾼다.
# 강의 삭제 때 할 일도 정리하는 예시 정책을 가정해 `종속된다`를 선택했다.
# 실제 프로젝트에서 작업 이력을 보존한다면 `후속 조치다` 등 다른 관계가 맞을 수 있다.

개념:
  - 이름: course
    한글명: 강의
    의미: "개별 강의와 그 운영에 필요한 기본 정보"
    명세문서: "docs/ontology/course.md"
    소스:
      - 이름: course_db
        한글명: 강의 DB
        태그: [정본]
        소스정보:
          범위: 강의의 이름과 식별 정보
      - 이름: course_copy
        한글명: 조회용 사본
        태그: [참고본, 우선 탐색 대상]
        소스정보:
          범위: 강의별 빠른 조회용 요약
          조건: "docs/COURSES.md의 강의 표"
    동기화:
      - 원본: course_db
        대상: course_copy
        방법: "원본 변경 후 승인된 생성 절차로 해당 강의 요약을 갱신하고 ID를 대조한다."
      - 원본: course_db
        대상: exports/COURSES.csv
        방법: "강의 목록 변경 후 배포용 CSV를 갱신한다."

  - 이름: task
    한글명: 할 일
    의미: "실행할 행동과 완료 여부를 별도로 추적하는 작업 항목"
    명세문서: "docs/ontology/task.md"
    소스:
      - 이름: task_db
        한글명: 할 일 DB
        태그: [정본, 우선 탐색 대상]
        소스정보:
          범위: 할 일의 내용과 강의 참조

관계:
  - 주체: task
    관계: 종속된다
    대상: course
    비고:
      - "이 예에서는 강의 삭제 시 해당 할 일도 함께 정리하는 정책을 가정한다. 실제 정책을 확인하지 못했다면 관계명만으로 삭제 처리를 확정하지 않는다."

소스:
  - 이름: course_db
    한글명: 강의 DB
    소스정보:
      유형: notion_database
      database_url: "https://www.notion.so/11111111111141118111111111111111"
      database_id: "11111111-1111-4111-8111-111111111111"
      data_source_id: "22222222-2222-4222-8222-222222222222"
    사용방법:
      - "프로젝트에서 확인한 도구와 절차로 강의 레코드를 조회한다."
      - "DB 필드와 API 제약은 [docs/notion/course-schema.md](docs/notion/course-schema.md)를 참조한다."

  - 이름: task_db
    한글명: 할 일 DB
    소스정보:
      유형: notion_database
      database_url: "https://www.notion.so/33333333333343338333333333333333"
      database_id: "33333333-3333-4333-8333-333333333333"
      data_source_id: "44444444-4444-4444-8444-444444444444"
    사용방법:
      - "프로젝트에서 확인한 도구와 절차로 할 일 레코드를 조회한다."
      - "DB 필드와 API 제약은 [docs/notion/task-schema.md](docs/notion/task-schema.md)를 참조한다."

  - 이름: course_copy
    한글명: 조회용 사본
    소스정보:
      유형: local_file
      기준경로: "C:/projects/sample-project"
      경로: "docs/COURSES.md"
      절대경로: "C:/projects/sample-project/docs/COURSES.md"
    사용방법:
      - "상대 경로는 소스정보의 기준경로를 기준으로 해석한다."
      - "원본과 ID를 대조해 사본의 최신성을 확인한다."
